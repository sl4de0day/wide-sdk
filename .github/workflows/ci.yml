name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [wide-rules-updated]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build Distribution Packages
        run: |
          python -m build

  publish-pypi:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and Auto-Version Package
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python -m pip install --upgrade pip build twine
          python - <<'PY'
          import json, os, pathlib, re, urllib.request
          p_toml = pathlib.Path("pyproject.toml")
          p_init = pathlib.Path("wide_sdk/__init__.py")
          txt = p_toml.read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
          cur_ver = m.group(1) if m else "0.5161126"
          existing = set()
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/wide-sdk/json", timeout=10) as r:
                  data = json.loads(r.read().decode("utf-8"))
                  existing = set((data.get("releases") or {}).keys())
          except Exception:
              pass
          if cur_ver in existing:
              run_no = os.environ.get("RUN_NUMBER", "1")
              new_ver = f"{cur_ver}.{run_no}"
              p_toml.write_text(re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{new_ver}"', txt, count=1, flags=re.M), encoding="utf-8")
              init_txt = p_init.read_text(encoding="utf-8")
              p_init.write_text(re.sub(r'^__version__\s*=\s*"[^"]+"', f'__version__ = "{new_ver}"', init_txt, count=1, flags=re.M), encoding="utf-8")
              print(f"Auto-bumped PyPI version {cur_ver} -> {new_ver}")
          PY
          python -m build

      - name: Publish to PyPI via Token
        if: env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --non-interactive --skip-existing dist/*

      - name: Publish to PyPI via OIDC Trusted Publisher
        if: env.PYPI_API_TOKEN == ''
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
