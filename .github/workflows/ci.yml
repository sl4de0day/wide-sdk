name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build Distribution Packages
        run: |
          python -m build

      - name: Dogfood Wide Security Scan
        if: matrix.python-version == '3.12'
        uses: sl4de0day/wide-action@v1
        with:
          fail-on: CRITICAL

  publish-pypi:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Detect Version Change
        id: check_version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess
          txt = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
          cur_ver = m.group(1) if m else ""
          prev_ver = ""
          try:
              prev_txt = subprocess.check_output(["git", "show", "HEAD~1:pyproject.toml"], text=True, stderr=subprocess.DEVNULL)
              pm = re.search(r'^version\s*=\s*"([^"]+)"', prev_txt, re.M)
              prev_ver = pm.group(1) if pm else ""
          except Exception:
              pass
          event_name = os.environ.get("EVENT_NAME", "")
          should_publish = "true" if (event_name == "workflow_dispatch" or (cur_ver and cur_ver != prev_ver)) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={cur_ver}\n")
              out.write(f"should_publish={should_publish}\n")
          print(f"Current version: {cur_ver} | Previous version: {prev_ver} | should_publish={should_publish}")
          PY

      - name: Build Package
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python - <<'PY'
          import pathlib, re
          p_toml = pathlib.Path("pyproject.toml")
          p_init = pathlib.Path("wide_sdk/__init__.py")
          txt = p_toml.read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
          cur_ver = m.group(1)
          init_txt = p_init.read_text(encoding="utf-8")
          p_init.write_text(re.sub(r'^__version__\s*=\s*"[^"]+"', f'__version__ = "{cur_ver}"', init_txt, count=1, flags=re.M), encoding="utf-8")
          PY
          python -m build

      - name: Publish to PyPI via Token
        if: steps.check_version.outputs.should_publish == 'true' && env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --non-interactive --skip-existing dist/*

      - name: Publish to PyPI via OIDC Trusted Publisher
        if: steps.check_version.outputs.should_publish == 'true' && env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Wide SDK $VERSION" --generate-notes --latest
          fi
