[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wide-sdk"
version = "0.4141126"
description = "Python SDK to build autonomous AI coding and web security agents powered by Wide"
readme = "README.md"
authors = [{ name = "sl4de" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = [
    "wide",
    "wide-sdk",
    "ai-agent",
    "devsecops",
    "appsec",
    "security-scanner",
    "sast",
    "fuzzer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1.0"]
mysql = ["pymysql>=1.1.0"]
redis = ["redis>=5.0.0"]
db = ["psycopg[binary]>=3.1.0", "pymysql>=1.1.0", "redis>=5.0.0"]

[project.urls]
Homepage = "https://github.com/sl4de0day/wide-sdk"
Repository = "https://github.com/sl4de0day/wide-sdk.git"
Issues = "https://github.com/sl4de0day/wide-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wide_sdk*"]
